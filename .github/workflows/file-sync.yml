name: File sync

on:
  push:
    branches: [feat/file-sync, main]
    paths:
      - '261128/**'
      - '.github/workflows/file-sync.yml'
  pull_request:
    paths:
      - '261128/**'
      - '.github/workflows/file-sync.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: 261128/file-sync
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified Go 1.27.4
        run: |
          tool_dir=$(mktemp -d "$RUNNER_TEMP/file-sync-go.XXXXXX")
          curl --fail --location --silent --show-error --retry 3 \
            https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o "$tool_dir/go.tar.gz"
          printf '%s  %s\n' 7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840 "$tool_dir/go.tar.gz" | sha256sum -c -
          tar -C "$tool_dir" -xzf "$tool_dir/go.tar.gz"
          printf '%s\n' "$tool_dir/go/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain and module checksums
        run: |
          go version
          gcc --version
          go mod download all
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Format, vet and build
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet -mod=readonly ./...
          go build -mod=readonly -o "$RUNNER_TEMP/file-sync" ./cmd/file-sync
      - name: Run local and hub sync tests
        run: go test -mod=readonly -v -count=1 -timeout=4m ./...
      - name: Run the race detector
        run: go test -mod=readonly -race -count=1 -timeout=4m ./...
