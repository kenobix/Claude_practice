name: Bike MLOps contract checks

on:
  push:
    paths:
      - "261021/**"
      - ".github/workflows/bike-mlops-contracts.yml"
  pull_request:
    paths:
      - "261021/**"
      - ".github/workflows/bike-mlops-contracts.yml"

jobs:
  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 261021
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            261021/pyproject.toml
            261021/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e '.[dev]'
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests scripts
