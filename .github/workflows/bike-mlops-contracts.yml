name: Bike MLOps contract checks

on:
  push:
    paths:
      - "261021/**"
      - ".github/workflows/bike-mlops-contracts.yml"
  pull_request:
    paths:
      - "261021/**"
      - ".github/workflows/bike-mlops-contracts.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 261021
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            261021/pyproject.toml
            261021/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e '.[dev]'
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests scripts

  synthetic-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: 261021
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            261021/pyproject.toml
            261021/requirements.lock
      - id: install-lock
        run: python -m pip install -r requirements.lock
      - id: install-project
        run: python -m pip install --no-deps --no-build-isolation -e '.[dev]'
      - id: pip-check
        run: python -m pip check
      - name: Run isolated synthetic Docker system test
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          set -o pipefail
          mkdir -p data/reports
          timeout --signal=TERM --kill-after=10 1200 python scripts/capital_system_harness.py \
            --run-synthetic-system --verify-paired-restore --evidence-dir data/reports/t16-ci 2>&1 \
            | tee data/reports/synthetic-system-ci.log
      - name: Run disposable PostgreSQL snapshot-lock test
        if: >-
          ${{ !cancelled() && steps.install-lock.outcome == 'success' &&
          steps.install-project.outcome == 'success' && steps.pip-check.outcome == 'success' }}
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          set -o pipefail
          timeout --signal=TERM 300 python scripts/test_capital_snapshot_postgres.py 2>&1 \
            | tee data/reports/snapshot-postgres-ci.log
      - name: Run disposable request interruption PostgreSQL test
        if: >-
          ${{ !cancelled() && steps.install-lock.outcome == 'success' &&
          steps.install-project.outcome == 'success' && steps.pip-check.outcome == 'success' }}
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10 180 python scripts/test_capital_request_interruption_postgres.py 2>&1 \
            | tee data/reports/request-interruption-postgres-ci.log
      - name: Run disposable PostgreSQL monitor reconciliation test
        if: >-
          ${{ !cancelled() && steps.install-lock.outcome == 'success' &&
          steps.install-project.outcome == 'success' && steps.pip-check.outcome == 'success' }}
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          set -o pipefail
          mkdir -p data/reports
          timeout --signal=TERM --kill-after=10 180 python scripts/test_monitor_inspection_postgres.py --run-disposable 2>&1 \
            | tee data/reports/monitor-inspection-postgres-ci.log
      - name: Run legacy prediction precision migration and restore test
        if: >-
          ${{ !cancelled() && steps.install-lock.outcome == 'success' &&
          steps.install-project.outcome == 'success' && steps.pip-check.outcome == 'success' }}
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          set -o pipefail
          mkdir -p data/reports
          timeout --signal=TERM --kill-after=10 180 python scripts/test_prediction_migration_postgres.py \
            --run-disposable --evidence-dir data/reports/t08-ci 2>&1 \
            | tee data/reports/prediction-migration-postgres-ci.log
      - name: Run disposable PostgreSQL monitor persistence test
        if: >-
          ${{ !cancelled() && steps.install-lock.outcome == 'success' &&
          steps.install-project.outcome == 'success' && steps.pip-check.outcome == 'success' }}
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          set -o pipefail
          mkdir -p data/reports
          timeout --signal=TERM --kill-after=10 300 python scripts/test_monitor_persistence_postgres.py 2>&1 \
            | tee data/reports/monitor-persistence-postgres-ci.log
      - name: Run disposable MLflow HTTP decision fault test
        if: >-
          ${{ !cancelled() && steps.install-lock.outcome == 'success' &&
          steps.install-project.outcome == 'success' && steps.pip-check.outcome == 'success' }}
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          set -o pipefail
          mkdir -p data/reports
          timeout --signal=TERM --kill-after=10 180 python scripts/test_capital_decision_http.py \
            --run-disposable --evidence-dir data/reports/t13-http-ci 2>&1 \
            | tee data/reports/capital-decision-http-ci.log
      - name: Upload synthetic system test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bike-mlops-docker-integration-logs
          path: |
            261021/data/reports/synthetic-system-ci.log
            261021/data/reports/snapshot-postgres-ci.log
            261021/data/reports/request-interruption-postgres-ci.log
            261021/data/reports/monitor-inspection-postgres-ci.log
            261021/data/reports/prediction-migration-postgres-ci.log
            261021/data/reports/monitor-persistence-postgres-ci.log
            261021/data/reports/capital-decision-http-ci.log
            261021/data/reports/t08-ci/summary.json
            261021/data/reports/t08-ci/before.dump
            261021/data/reports/t08-ci/after.dump
            261021/data/reports/t16-ci/synthetic-measurement-evidence.zip
            261021/data/reports/t16-ci/archive-sha256.json
            261021/data/reports/t16-ci/recalculation.json
          if-no-files-found: ignore
          retention-days: 14
