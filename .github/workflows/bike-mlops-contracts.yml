name: Bike MLOps contract checks

on:
  push:
    paths:
      - "261021/**"
      - ".github/workflows/bike-mlops-contracts.yml"
  pull_request:
    paths:
      - "261021/**"
      - ".github/workflows/bike-mlops-contracts.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 261021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 261021/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
