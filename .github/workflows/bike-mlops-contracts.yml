name: Bike MLOps contract checks

on:
  push:
    paths:
      - "261021/**"
      - ".github/workflows/bike-mlops-contracts.yml"
  pull_request:
    paths:
      - "261021/**"
      - ".github/workflows/bike-mlops-contracts.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 261021
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            261021/pyproject.toml
            261021/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e '.[dev]'
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests scripts

  synthetic-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: 261021
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            261021/pyproject.toml
            261021/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e '.[dev]'
      - run: python -m pip check
      - name: Run isolated synthetic Docker system test
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          mkdir -p data/reports
          timeout --signal=TERM 1200 python scripts/capital_system_harness.py --run-synthetic-system 2>&1 \
            | tee data/reports/synthetic-system-ci.log
      - name: Upload synthetic system test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bike-mlops-synthetic-system-log
          path: 261021/data/reports/synthetic-system-ci.log
          if-no-files-found: ignore
          retention-days: 14
