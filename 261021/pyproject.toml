[build-system]
requires = ["setuptools>=68,<69", "wheel>=0.42,<0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-demand-mlops"
version = "0.1.0"
description = "A reproducible, locally operated MLOps learning project for hourly bike demand"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "mlflow>=3.5,<4",
  "numpy==2.5.1",
  "pandas==3.0.5",
  "psycopg[binary]>=3.2,<4",
  "scikit-learn==1.9.0",
  "skops==0.16.0",
  "tzdata==2026.5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "httpx2>=2,<3", "pytest>=8.3,<9"]

[project.scripts]
mlops-bikectl = "bike_mlops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
